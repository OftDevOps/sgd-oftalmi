services:
  db:
    image: postgres:16
    container_name: sgd_oftalmi_db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: sgd_oftalmi_backend
    env_file:
      - .env
    volumes:
      - ./backend:/app:Z
      - ./storage:/storage:Z
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    container_name: sgd_oftalmi_frontend
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"

  nginx:
    build:
      context: .
      dockerfile: infrastructure/docker/nginx.Dockerfile
    container_name: sgd_oftalmi_nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"

volumes:
  postgres_data:
